<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #334155;
            padding: 20px;
        }

        .cabinet-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow:
                0 20px 25px -5px rgba(0, 0, 0, 0.1),
                0 8px 10px -6px rgba(0, 0, 0, 0.05),
                0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            width: 100%;
            max-width: 440px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cabinet-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .cabinet-header .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .cabinet-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .cabinet-header p {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .static-value {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            min-height: 48px;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .balance-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(168, 85, 247, 0.08) 100%);
            border: 1.5px solid rgba(99, 102, 241, 0.2);
            margin-bottom: 24px;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .balance-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .balance-value {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .balance-value .currency {
            font-size: 15px;
            font-weight: 600;
            color: #6366f1;
            margin-left: 4px;
        }

        .balance-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(99, 102, 241, 0.12);
        }

        .balance-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #6366f1;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
        }

        .switch-link {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        .switch-link a {
            color: #6366f1;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .switch-link a:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            margin: 10% auto;
            padding: 32px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .close {
            color: #94a3b8;
            font-size: 32px;
            font-weight: 400;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .close:hover {
            color: #475569;
        }

        .amount-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            color: #1e293b;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            margin-bottom: 16px;
            text-align: center;
        }

        .amount-input:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .quick-btn {
            padding: 10px;
            background-color: #f1f5f9;
            color: #475569;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-btn:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            color: #334155;
        }

        .quick-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="cabinet-card">
        <div class="cabinet-header">
            <div class="avatar">ИИ</div>
            <h2>Личный кабинет</h2>
            <p>Управляйте своим профилем и балансом</p>
        </div>

        <div class="form-group">
            <label>Имя пользователя</label>
            <div class="static-value">{{ user.username }}</div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <div class="static-value">Пока нет</div>
        </div>

        <div class="balance-card">
            <div class="balance-info">
                <span class="balance-label">Текущий баланс</span>
                <span class="balance-value" id="balance-display">{{ user.balance }}<span class="currency">₽</span></span>
            </div>
            <div class="balance-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="6" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M2 10h20"></path>
                    <circle cx="17" cy="15" r="1.5" fill="#6366f1" stroke="none"></circle>
                </svg>
            </div>
        </div>

        <button type="button" class="btn btn-primary" id="topup-btn" style="margin-bottom: 12px;">
            <svg viewBox="0 0 24 24">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Пополнить баланс
        </button>

        <button type="button" class="btn btn-primary" id="make-request-btn" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); margin-bottom: 12px;">
            <svg viewBox="0 0 24 24">
                <path d="M22 2L11 13"></path>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Сделать запрос (-3 ₽)
        </button>

        <button type="button" class="btn btn-primary" id="history-btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);" onclick="window.location.href='/history';">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 14"></polyline>
            </svg>
            История операций
        </button>

        <div class="switch-link">
            <a href="/logout">Выйти из аккаунта</a>
        </div>
    </div>

    <div id="topupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Пополнение баланса</h3>
                <span class="close">&times;</span>
            </div>
            <input type="number" class="amount-input" id="amount-input" placeholder="Введите сумму" min="1" max="10000">
            <div class="quick-amounts">
                <button class="quick-btn" data-amount="100">100 ₽</button>
                <button class="quick-btn" data-amount="500">500 ₽</button>
                <button class="quick-btn" data-amount="1000">1000 ₽</button>
            </div>
            <button type="button" class="btn btn-primary" id="confirm-topup">Пополнить</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../static/script.js"></script>
</body>
</html>
